name: Deploy Lecture Notes to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "lecture-notes/**"
      - "runners/build_lecture_notes.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # 로컬 빌드(requirements.txt)와 같은 버전으로 고정합니다.
        # 고정하지 않으면 그날의 최신판이 깔려 커밋된 HTML과 다른 페이지가 배포됩니다.
        # (2026-10-14 배포는 Markdown 3.11.1이 깔려 30개 페이지에 굵은 글씨 기호 ** 가 그대로 보였습니다.)
        run: |
          python -m pip install --upgrade pip
          pip install "markdown==3.10.3" "jinja2==3.1.6"

      - name: Build Lecture Notes
        run: |
          python runners/build_lecture_notes.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "lecture-notes"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
